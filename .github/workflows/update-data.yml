name: Update schedule and news

on:
  schedule:
    # Every 3 hours, plus every 30 minutes on Thursday/Friday evenings (match nights; times are UTC).
    - cron: "17 */3 * * *"
    - cron: "*/30 17-22 * * 4,5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch schedule (Teambeheer) and news (PDC, NOS, YouTube)
        run: python tools/fetch_live.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/; then
            echo "No changes."
            exit 0
          fi
          git config user.name "schedule-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.js data/news.js
          git commit -m "Update schedule and news"
          git push
